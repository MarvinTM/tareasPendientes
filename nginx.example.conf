# Nginx configuration for Tareas Pendientes
# Copy this file to /etc/nginx/sites-available/tareas-pendientes
# Then create a symlink: ln -s /etc/nginx/sites-available/tareas-pendientes /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name yourdomain.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend static files
    root /var/www/tareas-pendientes/frontend/dist;
    index index.html;

    # Allow the service worker to control the whole origin
    location = /sw.js {
        add_header Service-Worker-Allowed /;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    # Always retrieve the current application shell. Hashed assets remain
    # cacheable below, but stale HTML must not keep an old bundle alive.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    # Web manifest content type
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # API proxy to backend
    location /api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.io support
    location /socket.io/ {
        proxy_pass http://localhost:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- aiRoadmap: separate app (sister repo "roadmap") served at /roadmap/ ----
    # Access is gated by the Tareas login: before proxying, nginx asks the
    # Tareas backend whether the request's `token` cookie belongs to an
    # approved user (/api/auth/me answers 200, 401 or 403).
    location = /_tareas_auth {
        internal;
        proxy_pass http://127.0.0.1:3001/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location = /roadmap {
        return 301 /roadmap/;
    }

    # ^~ so the /assets/ caching regex below never captures roadmap files.
    location ^~ /roadmap/ {
        auth_request /_tareas_auth;
        error_page 401 = @roadmap_login;    # not logged in -> Google login
        error_page 403 = @roadmap_pending;  # logged in, not approved yet

        proxy_pass http://127.0.0.1:3002/;  # trailing slash strips /roadmap
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;           # matches the roadmap API limit
    }

    location @roadmap_login {
        return 302 /api/auth/google?redirect_origin=https%3A%2F%2F$host%2Froadmap%2F;
    }

    location @roadmap_pending {
        return 302 /;  # the Tareas app shows the "pending approval" screen
    }

    # Frontend routes (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
